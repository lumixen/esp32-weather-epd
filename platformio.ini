; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_d32
; Unit test suites live in test/src/<suite>; the rest of test/ holds the
; Docker/QEMU test infrastructure (Dockerfile, broker scripts).
test_dir = test/src

[env]
; pioarduino platform: Arduino core compiled as an ESP-IDF component on
; ESP-IDF 5.5 (Arduino 3.3.11). ESP-IDF configuration is managed through
; sdkconfig.defaults; run `pio run -t menuconfig` to adjust it interactively.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
build_flags = '-Wall'
lib_deps =
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit Unified Sensor @ 1.1.15
  bblanchon/ArduinoJson @ 7.4.2
  zinggjm/GxEPD2 @ 1.6.9
  signetica/MoonRise @ 2.0.4
  https://github.com/CelliesProjects/moonPhase-esp32.git#2.0.0
  https://github.com/lumixen/ESP32MQTTClient.git#e2cab5264874d982a2a69e550358dde1e80495da
  adafruit/Adafruit BME280 Library @ 2.3.0
extra_scripts = 
  pre:scripts/sdkconfig_env.py
  scripts/config.py

[env:lolin_d32]
board = lolin_d32
monitor_speed = 115200
monitor_filters= time, log2file
; custom partition table (vendor of the Arduino huge_app layout: 3MB app,
; ~900KB spiffs, coredump); referenced from sdkconfig.defaults as well
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = partitions/huge_app.csv
; MCU frequency is set in sdkconfig.defaults (CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80)
custom_sdkconfig =
  CONFIG_SPI_FLASH_SUPPORT_BOYA_CHIP=y

; Unit testing environment: compiles src/ together with the tests in
; test/src/ and runs them inside the ESP32 QEMU emulator (no hardware needed).
; Run with: test/run_tests_docker.sh
[env:lolin_d32_qemu]
board = lolin_d32
board_build.partitions = partitions/huge_app.csv
build_flags = '-Wall' '-DUNITY_SUPPORT_64=1'
; pioarduino compiles src/ via the IDF build, which does not receive the
; PIO_UNIT_TESTING macro that PlatformIO's test runner sets for libraries;
; define it explicitly so that main.cpp's setup()/loop() are excluded and
; the Unity test suite can provide its own.
build_src_flags = '-DPIO_UNIT_TESTING'
test_build_src = yes
test_testing_command = ${PROJECT_DIR}/test/qemu_test_broker.sh
