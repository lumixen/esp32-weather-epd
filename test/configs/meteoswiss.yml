# Pinned configuration for the MeteoSwiss forecast-provider tests.
# The network is never used by the fixture tests.

display:
  panel: GENERIC_BW_V2
  driverBoard: Good Display DESPI-C02
  pins:
    busy: 14
    chipSelect: 13
    reset: 21
    dataCommand: 22
    power: 26
    clock: 18
    miso: 19
    mosi: 23
providers:
  - provider: meteoswiss_forecast
    forecastPointId: '800100'
    stationId: KLO
wifi:
  ssid: your-wifi-ssid
  password: your-wifi-password
  scan: false
  timeoutMs: 10000
ntp:
  servers:
    - pool.ntp.org
    - time.nist.gov
  syncIntervalWakeups: 6
  timeoutMs: 20000
  rtcCorrection: true
location:
  latitude: 47.3769
  longitude: 8.5417
  city: Zurich
  timezone: Europe/Zurich
rendering:
  locale: en_GB
  font: FreeSans
  units:
    temperature: Celsius
    speed: km/h
    pressure: hPa
    distance: km
    hourlyPrecipitation: probability of precipitation
    dailyPrecipitation: mm
  windDirectionIndicator: arrow
  windArrowPrecision: secondary intercardinal
  displayDailyPrecip: smart
  displayHourlyIcons: true
  moonPhaseStyle: primary
  hourlyGraphMax: 24
  timeFormat: '%H:%M'
  hourFormat: '%H'
  dateFormat: '%x'
  refreshTimeFormat: '%x %H:%M'
  statusBar:
    showBatteryVoltage: false
    showWifiRssi: false
  leftPanelLayout:
    - SUNRISE
    - SUNSET
    - MOONRISE
    - MOONSET
    - MOONPHASE
    - HUMIDITY
    - WIND
    - PRESSURE
    - VISIBILITY
  colors:
    outlookLowThresholdTemperature: 0
    outlookHighThresholdTemperature: 35
    outlookTemperatureLowColor: black
    outlookTemperatureNormalColor: black
    outlookTemperatureHighColor: black
    outlookConditionsIconAccent: black
    city: black
    date: black
    alert: black
    errorIcon: black
    statusBarBatteryWarning: black
    statusBarWeakWifi: black
    statusBarMessage: black
    forecastPrecipitation: black
battery:
  monitoring: true
  adcPin: 35
schedule:
  refreshMinutes: 30
  bedTime: 0
  wakeTime: 6
logLevel: debug
homeAssistantMqtt:
  enabled: false
