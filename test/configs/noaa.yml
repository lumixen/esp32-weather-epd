# Pinned configuration for the QEMU unit test run with the NOAA/NWS
# weather provider. Boston is within NWS coverage and is also the fixed point
# used by the committed response fixtures. Tests never access the network.
epdPanel: GENERIC_BW_V2
epdDriver: Good Display DESPI-C02
locale: en_GB

providers:
  - provider: noaa_forecast

ntp:
  server_1: pool.ntp.org
  server_2: time.nist.gov
  syncIntervalWakeups: 6
  timeout: 20000

pin:
  batAdc: 35
  epdBusy: 14
  epdCS: 13
  epdRst: 21
  epdDC: 22
  epdSCK: 18
  epdMISO: 19
  epdMOSI: 23
  epdPwr: 26

useImperialUnitsAsDefault: false
unitsTemp: Celsius
unitsSpeed: km/h
unitsPres: hPa
unitsDistance: km
unitsHourlyPrecip: probability of precipitation
unitsDailyPrecip: probability of precipitation
windDirectionIndicator: arrow
windArrowPrecision: secondary intercardinal
font: FreeSans
displayDailyPrecip: smart
displayHourlyIcons: true
batteryMonitoring: true
statusBarExtrasBatVoltage: false
statusBarExtrasWifiRSSI: false
logLevel: debug

wifi:
  ssid: your-wifi-ssid
  password: your-wifi-password
  timeout: 10000
  scan: false

latitude: "42.3601"
longitude: "-71.0589"
city: Boston
timezone: America/New_York
timeFormat: "%H:%M"
hourFormat: "%H"
dateFormat: "%x"
refreshTimeFormat: "%x %H:%M"
sleepDuration: 30
bedTime: 0
wakeTime: 6
hourlyGraphMax: 24
moonPhaseStyle: primary


leftPanelLayout:
  SUNRISE: 0
  SUNSET: 1
  MOONRISE: 2
  MOONSET: 3
  MOONPHASE: 4
  HUMIDITY: 5
  WIND: 6
  PRESSURE: 7
  VISIBILITY: 8

homeAssistantMqtt:
  enabled: false

colors:
  outlookLowThresholdTemperature: 0
  outlookHighThresholdTemperature: 35
  outlookTemperatureLowColor: black
  outlookTemperatureNormalColor: black
  outlookTemperatureHighColor: black
  outlookConditionsIconAccent: black
  city: black
  date: black
  alert: black
  errorIcon: black
  statusBarBatteryWarning: black
  statusBarWeakWifi: black
  statusBarMessage: black
  forecastPrecipitation: black