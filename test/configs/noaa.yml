# Pinned configuration for the QEMU unit test run with the NOAA/NWS
# weather provider. Boston is within NWS coverage and is also the fixed point
# used by the committed response fixtures. Tests never access the network.

display:
  panel: GENERIC_BW_V2
  driverBoard: Good Display DESPI-C02
  pins:
    busy: 14
    chipSelect: 13
    reset: 21
    dataCommand: 22
    power: 26
    clock: 18
    miso: 19
    mosi: 23
providers:
  - provider: noaa_forecast
wifi:
  ssid: your-wifi-ssid
  password: your-wifi-password
  scan: false
  timeoutMs: 10000
ntp:
  servers:
    - pool.ntp.org
    - time.nist.gov
  syncIntervalWakeups: 6
  timeoutMs: 20000
  rtcCorrection: true
location:
  latitude: 42.3601
  longitude: -71.0589
  city: Boston
  timezone: America/New_York
rendering:
  locale: en_GB
  font: FreeSans
  units:
    temperature: Celsius
    speed: km/h
    pressure: hPa
    distance: km
    hourlyPrecipitation: probability of precipitation
    dailyPrecipitation: probability of precipitation
  windDirectionIndicator: arrow
  windArrowPrecision: secondary intercardinal
  displayDailyPrecip: smart
  displayHourlyIcons: true
  moonPhaseStyle: primary
  hourlyGraphMax: 24
  timeFormat: '%H:%M'
  hourFormat: '%H'
  dateFormat: '%x'
  refreshTimeFormat: '%x %H:%M'
  statusBar:
    showBatteryVoltage: false
    showWifiRssi: false
  leftPanelLayout:
    1: SUNRISE
    2: SUNSET
    3: MOONRISE
    4: MOONSET
    5: MOONPHASE
    6: HUMIDITY
    7: WIND
    8: PRESSURE
    9: VISIBILITY
  colors:
    outlookLowThresholdTemperature: 0
    outlookHighThresholdTemperature: 35
    outlookTemperatureLowColor: black
    outlookTemperatureNormalColor: black
    outlookTemperatureHighColor: black
    outlookConditionsIconAccent: black
    city: black
    date: black
    alert: black
    errorIcon: black
    statusBarBatteryWarning: black
    statusBarWeakWifi: black
    statusBarMessage: black
    forecastPrecipitation: black
battery:
  monitoring: true
  adcPin: 35
schedule:
  refreshMinutes: 30
  bedTime: 0
  wakeTime: 6
logLevel: debug
homeAssistantMqtt:
  enabled: false
