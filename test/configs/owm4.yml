# Pinned configuration for the QEMU unit test run with the OpenWeatherMap
# weather provider (the test runner sets ESP32_EPD_CONFIG to this file).
#
# Uses the OpenWeatherMap One Call v4 provider for current/hourly/daily forecast,
# plus the standalone OpenWeatherMap air-quality provider. v4 alerts are
# enabled to compile and exercise the optional alert operation. Committed on
# purpose: test builds must never depend on the untracked local config.yml.
# Credentials are placeholders; the tests never go on the network.

display:
  panel: DKE_3C_86BF
  driverBoard: Waveshare
  pins:
    busy: 4
    chipSelect: 5
    reset: 16
    dataCommand: 17
    power: 2
providers:
  - provider: openweathermap_onecall_v4
    transport: HTTP
    apiKey: test
    alerts: true
  - provider: openweathermap_air_quality
    transport: HTTP
    apiKey: test
  - provider: bme280
    address: 118
    pins:
      power: 27
      sda: 21
      scl: 22
wifi:
  ssid: your-ssid
  password: your-password
ntp:
  servers:
    - 192.168.41.1
    - pool.ntp.org
  syncIntervalWakeups: 6
  timeoutMs: 20000
  rtcCorrection: true
location:
  latitude: 59.329323
  longitude: 18.06858
  city: Stockholm
  timezone: CET-1CEST,M3.5.0/2,M10.5.0/3
rendering:
  locale: pt_BR
  font: FreeSans
  units:
    temperature: Celsius
    speed: km/h
    pressure: mbar
    distance: km
    hourlyPrecipitation: probability of precipitation
    dailyPrecipitation: mm
  windDirectionIndicator: arrow
  windArrowPrecision: secondary intercardinal
  displayDailyPrecip: smart
  displayHourlyIcons: true
  moonPhaseStyle: alternative
  hourlyGraphMax: 24
  timeFormat: '%H:%M'
  hourFormat: '%H'
  dateFormat: '%d/%m/%Y'
  refreshTimeFormat: '%x %H:%M'
  statusBar:
    showBatteryVoltage: true
    showWifiRssi: false
  leftPanelLayout:
    - SUNRISE
    - SUNSET
    - MOONRISE
    - MOONSET
    - MOONPHASE
    - HUMIDITY
    - WIND
    - INPRESSURE
    - AIR_QUALITY
    - VISIBILITY
  colors:
    outlookLowThresholdTemperature: 0
    outlookHighThresholdTemperature: 30
    outlookTemperatureLowColor: red
    outlookTemperatureNormalColor: black
    outlookTemperatureHighColor: red
    outlookConditionsIconAccent: red
    city: black
    date: red
    alert: red
    errorIcon: red
    statusBarBatteryWarning: red
    statusBarWeakWifi: red
    statusBarMessage: red
    forecastPrecipitation: red
battery:
  monitoring: true
  adcPin: 35
schedule:
  refreshMinutes: 30
  bedTime: 0
  wakeTime: 0
logLevel: debug
homeAssistantMqtt:
  enabled: true
  server: 192.168.41.2
  port: 1883
  username: epd_weather
  password: your-mqtt-password
  discoveryPrefix: homeassistant
