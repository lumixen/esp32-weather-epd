# Example configuration for the ESP32 weather e-paper display.
#
# Copy this file to config.yml and adjust the values to your setup.
# The weather/air-quality providers (Open-Meteo) work without API keys;
# NOAA/NWS is also keyless but primarily covers the United States.

# E-paper hardware and driver board.
display:
  panel: GENERIC_BW_V2
  driverBoard: Good Display DESPI-C02
  pins:
    busy: 14
    chipSelect: 13
    reset: 21
    dataCommand: 22
    power: 26
    clock: 18
    miso: 19
    mosi: 23

# Providers are combined by capability. Keep only one forecast provider.
providers:
  - provider: open_meteo_forecast
    transport: HTTPS_VERIFY
  # - provider: noaa_forecast
  # OpenWeatherMap alternatives require an apiKey on the provider entry.
  # - provider: openweathermap_onecall_v4
  #   transport: HTTPS_VERIFY
  #   apiKey: your-owm-api-key
  #   alerts: true
  - provider: open_meteo_air_quality
    transport: HTTPS_VERIFY
  - provider: meteoalarm_alert
    country: netherlands
  # Add this entry to enable a local BME280 sensor; omit it to disable it.
  # - provider: bme280
  #   pins:
  #     power: 27
  #     sda: 21
  #     scl: 22
  #   address: 0x76

# WiFi network settings.
wifi:
  ssid: your-wifi-ssid
  password: your-wifi-password
  timeoutMs: 10000
  scan: false
  # Optional access-point lock and static IP settings:
  # bssid: 4A:8F:5A:21:EB:72
  # staticIp:
  #   ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 8.8.8.8
  #   dns2: 8.8.4.4

# Time synchronization. The first server is primary; the second is fallback.
ntp:
  servers:
    - pool.ntp.org
    - time.nist.gov
  syncIntervalWakeups: 6
  timeoutMs: 20000
  rtcCorrection: true

# Installation location and timezone.
location:
  latitude: 51.5072
  longitude: -0.1276
  city: London
  timezone: Europe/London

# How weather data is formatted and rendered.
rendering:
  locale: en_GB
  font: FreeSans
  units:
    temperature: Celsius
    speed: km/h
    pressure: hPa
    distance: km
    hourlyPrecipitation: probability of precipitation
    dailyPrecipitation: mm
  windDirectionIndicator: arrow
  windArrowPrecision: secondary intercardinal
  displayDailyPrecip: smart
  displayHourlyIcons: true
  moonPhaseStyle: primary
  hourlyGraphMax: 24
  timeFormat: "%H:%M"
  hourFormat: "%H"
  dateFormat: "%x"
  refreshTimeFormat: "%x %H:%M"
  statusBar:
    showBatteryVoltage: false
    showWifiRssi: false
  # List entries in the order in which they should appear.
  leftPanelLayout:
    - SUNRISE
    - SUNSET
    - MOONRISE
    - MOONSET
    - MOONPHASE
    - HUMIDITY
    - WIND
    - PRESSURE
    - AIR_QUALITY
    - VISIBILITY
  colors:
    outlookLowThresholdTemperature: 0
    outlookHighThresholdTemperature: 35
    outlookTemperatureLowColor: black
    outlookTemperatureNormalColor: black
    outlookTemperatureHighColor: black
    outlookConditionsIconAccent: black
    city: black
    date: black
    alert: black
    errorIcon: black
    statusBarBatteryWarning: black
    statusBarWeakWifi: black
    statusBarMessage: black
    forecastPrecipitation: black

# Battery measurement and monitoring.
battery:
  monitoring: true
  adcPin: 35

# Refresh and sleep schedule.
schedule:
  refreshMinutes: 30
  bedTime: 0
  wakeTime: 6

# Optional Home Assistant MQTT integration.
homeAssistantMqtt:
  enabled: false

logLevel: debug
