# Example configuration for the ESP32 weather e-paper display.
#
# Copy this file to config.yml and adjust the values to your setup.
# The weather/air-quality providers (Open-Meteo) work without any API keys;
# NOAA/NWS is also keyless but primarily covers the United States. The
# MeteoAlarm alerts provider only needs the country slug below.
#
# NOTE: the Open-Meteo unit suite links MeteoAlarmAlertProvider::FeedParser;
# the pinned test configuration includes the MeteoAlarm provider.
epdPanel: GENERIC_BW_V2
epdDriver: Good Display DESPI-C02
locale: en_GB

providers:
  - provider: open_meteo_forecast
    transport: HTTPS_VERIFY
  # NOAA/NWS is an alternative forecast owner; do not enable it together
  # with Open-Meteo or OpenWeatherMap forecast providers.
  # - provider: noaa_forecast
  # OpenWeatherMap One Call 4.0 uses separate current/hourly/daily timeline
  # requests. Set alerts to true to use the IDs from the current response and
  # fetch alert details from the separate per-ID endpoint. At most two IDs are
  # fetched by design; omit alerts or set it to false to make no detail
  # requests. v4 alerts own the alerts capability, so do not enable another
  # alert provider at the same time.
  # - provider: openweathermap_onecall_v4
  #   transport: HTTPS_VERIFY
  #   apiKey: your-owm-api-key
  #   alerts: true
  # MeteoSwiss uses a six-digit local forecast point_id and an explicit
  # SwissMetNet station for measured current conditions. It is an alternative
  # forecast owner; do not enable it with another forecast provider.
  # - provider: meteoswiss_forecast
  #   forecastPointId: "800100"
  #   stationId: KLO
  - provider: open_meteo_air_quality
    transport: HTTPS_VERIFY
  - provider: meteoalarm_alert
    country: netherlands
  # Add this entry to enable a local BME280 sensor. Omit it to disable it.
  # - provider: bme280
  #   pinPwr: 27
  #   pinSDA: 21
  #   pinSCL: 22
  #   address: 0x76

ntp:
  server_1: pool.ntp.org
  server_2: time.nist.gov
  syncIntervalWakeups: 6
  timeout: 20000

pin:
  batAdc: 35
  epdBusy: 14
  epdCS: 13
  epdRst: 21
  epdDC: 22
  epdSCK: 18
  epdMISO: 19
  epdMOSI: 23
  epdPwr: 26

useImperialUnitsAsDefault: false
unitsTemp: Celsius
unitsSpeed: km/h
unitsPres: hPa
unitsDistance: km
unitsHourlyPrecip: probability of precipitation
unitsDailyPrecip: mm
windDirectionIndicator: arrow
windArrowPrecision: secondary intercardinal
font: FreeSans
displayDailyPrecip: smart
displayHourlyIcons: true
batteryMonitoring: true
statusBarExtrasBatVoltage: false
statusBarExtrasWifiRSSI: false
logLevel: debug

wifi:
  ssid: your-wifi-ssid
  password: your-wifi-password
  timeout: 10000
  scan: false

latitude: "51.5072"
longitude: "-0.1276"
city: London
timezone: Europe/London
timeFormat: "%H:%M"
hourFormat: "%H"
dateFormat: "%x"
refreshTimeFormat: "%x %H:%M"
sleepDuration: 30
bedTime: 0
wakeTime: 6
hourlyGraphMax: 24
moonPhaseStyle: primary

leftPanelLayout:
  SUNRISE: 0
  SUNSET: 1
  MOONRISE: 2
  MOONSET: 3
  MOONPHASE: 4
  HUMIDITY: 5
  WIND: 6
  PRESSURE: 7
  AIR_QUALITY: 8
  VISIBILITY: 9

homeAssistantMqtt:
  enabled: false

colors:
  outlookLowThresholdTemperature: 0
  outlookHighThresholdTemperature: 35
  outlookTemperatureLowColor: black
  outlookTemperatureNormalColor: black
  outlookTemperatureHighColor: black
  outlookConditionsIconAccent: black
  city: black
  date: black
  alert: black
  errorIcon: black
  statusBarBatteryWarning: black
  statusBarWeakWifi: black
  statusBarMessage: black
  forecastPrecipitation: black
