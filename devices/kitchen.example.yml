# Per-device configuration template.
#
# Copy this file to devices/<name>.yml and edit it to match your device.
# Each device file is independent: display hardware, WiFi, location,
# providers, MQTT, and rendering settings can all vary per device.
#
#   cp devices/kitchen.example.yml devices/kitchen.yml
#   ./scripts/devices.sh flash kitchen
#
# devices/<name>.yml files are gitignored because they contain credentials;
# only this *.example.yml template is tracked.

# E-paper hardware and driver board.
display:
  panel: DKE_3C_86BF
  driverBoard: Waveshare
  pins:
    busy: 4
    chipSelect: 5
    reset: 16
    dataCommand: 17
    power: 2
    # Optional SPI pins use board defaults when omitted.
    # clock: 18
    # miso: 19
    # mosi: 23

# Weather, air-quality, alert, and local sensor providers.
providers:
  - provider: open_meteo_forecast
    transport: HTTP
  - provider: open_meteo_air_quality
    transport: HTTP
  - provider: meteoalarm_alert
    country: ukraine
  - provider: bme280
    pins:
      power: 27
      sda: 21
      scl: 22
    address: 0x76

# OpenWeatherMap credentials belong on the provider entry:
# - provider: openweathermap_onecall_v4
#   transport: HTTPS_VERIFY
#   apiKey: your-owm-api-key
#   alerts: true

# Time synchronization.
ntp:
  servers:
    - 192.168.41.1
    - pool.ntp.org
  syncIntervalWakeups: 6
  timeoutMs: 20000
  rtcCorrection: true

# WiFi network.
wifi:
  ssid: your-ssid
  password: your-password
  # Optional: lock to a specific access point.
  # bssid: 4A:8F:5A:21:EB:72
  # Optional static IP; omit for DHCP.
  # staticIp:
  #   ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 8.8.8.8
  #   dns2: 8.8.4.4

# Installation location and timezone.
location:
  latitude: 50.498878
  longitude: 30.497396
  city: Kyiv
  timezone: EET-2EEST,M3.5.0/3,M10.5.0/4

# User-facing formatting and rendering.
rendering:
  locale: en_US
  font: FreeSans
  units:
    temperature: Celsius
    speed: km/h
    pressure: mbar
    distance: km
    hourlyPrecipitation: probability of precipitation
    dailyPrecipitation: mm
  windDirectionIndicator: arrow
  windArrowPrecision: secondary intercardinal
  displayDailyPrecip: smart
  displayHourlyIcons: true
  moonPhaseStyle: alternative
  hourlyGraphMax: 24
  timeFormat: "%H:%M"
  hourFormat: "%H"
  dateFormat: "%d/%m/%Y"
  refreshTimeFormat: "%x %H:%M"
  statusBar:
    showBatteryVoltage: true
    showWifiRssi: false
  leftPanelLayout:
    1: SUNRISE
    2: SUNSET
    3: MOONRISE
    4: MOONSET
    5: MOONPHASE
    6: HUMIDITY
    7: WIND
    8: INPRESSURE
    9: AIR_QUALITY
    10: VISIBILITY
  colors:
    outlookLowThresholdTemperature: 0
    outlookHighThresholdTemperature: 30
    outlookTemperatureLowColor: red
    outlookTemperatureNormalColor: black
    outlookTemperatureHighColor: red
    outlookConditionsIconAccent: red
    city: black
    date: red
    alert: red
    errorIcon: red
    statusBarBatteryWarning: red
    statusBarWeakWifi: red
    statusBarMessage: red
    forecastPrecipitation: red

# Battery measurement and monitoring.
battery:
  monitoring: true
  adcPin: 35

# Refresh and sleep schedule.
schedule:
  refreshMinutes: 30
  bedTime: 0
  wakeTime: 0

# Optional Home Assistant MQTT integration.
homeAssistantMqtt:
  enabled: true
  server: 192.168.41.2
  port: 1883
  username: epd_weather
  password: your-mqtt-password
  discoveryPrefix: homeassistant

logLevel: debug
