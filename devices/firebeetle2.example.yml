# FireBeetle 2 ESP32-E device configuration template.
#
# This pinout matches the original lmarzen/esp32-weather-epd wiring. Copy this
# file to devices/<name>.yml, then edit the network, location, and provider
# settings for the device.
#
#   cp devices/firebeetle2.example.yml devices/firebeetle2.yml
#   ./scripts/devices.sh flash firebeetle2 --env dfrobot_firebeetle2_esp32e
#
# Device files are gitignored because they may contain credentials; only this
# template is tracked.

display:
  panel: GENERIC_BW_V2
  driverBoard: Good Display DESPI-C02
  # Original FireBeetle 2 ESP32-E e-paper wiring.
  pins:
    busy: 14
    chipSelect: 13
    reset: 21
    dataCommand: 22
    power: 26
    clock: 18
    miso: 19
    mosi: 23

providers:
  - provider: open_meteo_forecast
    transport: HTTPS_VERIFY
  - provider: open_meteo_air_quality
    transport: HTTPS_VERIFY
  - provider: meteoalarm_alert
    country: netherlands
  # Original FireBeetle 2 ESP32-E BME280 wiring.
  - provider: bme280
    pins:
      power: 4
      sda: 17
      scl: 16
    address: 0x76

wifi:
  ssid: your-wifi-ssid
  password: your-wifi-password
  timeoutMs: 10000
  scan: false

ntp:
  servers:
    - pool.ntp.org
    - time.nist.gov
  syncIntervalWakeups: 6
  timeoutMs: 20000
  rtcCorrection: true

location:
  latitude: 51.5072
  longitude: -0.1276
  city: London
  timezone: Europe/London

rendering:
  locale: en_GB
  font: FreeSans
  units:
    temperature: Celsius
    speed: km/h
    pressure: hPa
    distance: km
    hourlyPrecipitation: probability of precipitation
    dailyPrecipitation: mm
  windDirectionIndicator: arrow
  windArrowPrecision: secondary intercardinal
  displayDailyPrecip: smart
  displayHourlyIcons: true
  moonPhaseStyle: primary
  hourlyGraphMax: 24
  timeFormat: "%H:%M"
  hourFormat: "%H"
  dateFormat: "%x"
  refreshTimeFormat: "%x %H:%M"
  statusBar:
    showBatteryVoltage: false
    showWifiRssi: false
  leftPanelLayout:
    1: SUNRISE
    2: SUNSET
    3: MOONRISE
    4: MOONSET
    5: MOONPHASE
    6: HUMIDITY
    7: WIND
    8: PRESSURE
    9: AIR_QUALITY
    10: VISIBILITY
  colors:
    outlookLowThresholdTemperature: 0
    outlookHighThresholdTemperature: 35
    outlookTemperatureLowColor: black
    outlookTemperatureNormalColor: black
    outlookTemperatureHighColor: black
    outlookConditionsIconAccent: black
    city: black
    date: black
    alertIcon: black
    errorIcon: black
    statusBarBatteryWarning: black
    statusBarWeakWifi: black
    statusBarMessage: black
    forecastPrecipitation: black

# The original FireBeetle 2 ESP32-E uses A2, which is GPIO34, for the
# onboard 1M + 1M battery-voltage divider.
battery:
  monitoring: true
  adcPin: 34

schedule:
  refreshMinutes: 30
  bedTime: 0
  wakeTime: 6

homeAssistantMqtt:
  enabled: false

logLevel: debug
