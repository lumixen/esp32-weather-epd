name: Build

on:
  push:

jobs:
  build:
    name: Build ${{ matrix.board_name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Build both boards on Ubuntu, while retaining Lolin coverage on the
      # macOS and Windows runners.
      matrix:
        include:
          - os: ubuntu-latest
            board_name: Lolin D32
            environment: lolin_d32
            config: ./config.example.yml
          - os: ubuntu-latest
            board_name: FireBeetle 2 ESP32-E
            environment: dfrobot_firebeetle2_esp32e
            config: devices/firebeetle2.example.yml
          - os: macos-latest
            board_name: Lolin D32
            environment: lolin_d32
            config: ./config.example.yml
          - os: windows-latest
            board_name: Lolin D32
            environment: lolin_d32
            config: ./config.example.yml
    # A fresh Windows Lolin build can take about 30 minutes while PlatformIO
    # downloads and extracts the ESP-IDF toolchain.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          # Build artifacts are board-specific; cache only PlatformIO's
          # packages and toolchains, which are shared by all board jobs.
          path: ~/.platformio
          key: ${{ runner.os }}-pio-build-${{ hashFiles('platformio.ini', 'sdkconfig.defaults', 'partitions/huge_app.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-build-

      - name: Install PlatformIO Core
        # PlatformIO 6.2 pulls SCons 4.11, which is incompatible with the
        # pioarduino platform used by this project.
        run: pip install platformio==6.1.19

      - name: Build PlatformIO Project
        env:
          ESP32_EPD_CONFIG: ${{ matrix.config }}
        run: pio run -e ${{ matrix.environment }}
