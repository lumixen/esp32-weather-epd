name: Build

on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-build-${{ hashFiles('platformio.ini', 'sdkconfig.defaults', 'partitions/huge_app.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-build-

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Create config from example
        shell: bash
        run: cp -n config.example.yml config.yml

      - name: Build PlatformIO Project
        run: pio run -e lolin_d32
