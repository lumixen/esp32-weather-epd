name: Tests

on:
  push:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: platformio/test
          push: false
          load: true
          tags: esp32-weather-epd-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: .ci/pio
          key: pio-packages-${{ hashFiles('platformio/platformio.ini', 'platformio/test/Dockerfile') }}
          restore-keys: |
            pio-packages-

      - name: Cache PlatformIO build
        uses: actions/cache@v4
        with:
          path: platformio/.pio
          key: pio-build-${{ hashFiles('platformio/platformio.ini', 'platformio/test/Dockerfile') }}
          restore-keys: |
            pio-build-

      - name: Create config from example
        working-directory: platformio
        shell: bash
        run: cp -n config.example.yml config.yml

      - name: Run unit tests (QEMU)
        working-directory: platformio
        env:
          PIO_HOST_DIR: ${{ github.workspace }}/.ci/pio
        run: bash test/run_tests_docker.sh